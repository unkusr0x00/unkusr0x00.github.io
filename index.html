<canvas id="c" tabindex="0" role="img" aria-label="A lake at night. A black hole ringed with light rises over the mountains and is mirrored in the water. Touch the water to disturb it, drag to look around, scroll or pinch to zoom."></canvas>
<p id="hint" aria-live="polite"></p>
<p id="still">This is a still. The living picture needs a browser with WebGL 2.</p>
<script>
const SRC = {
bake_disk: `// Prepared once: the glowing disk, unrolled (x: angle around, y: distance outward on a log scale).
// Red: how much gas there is. Green: thin hot filaments. Blue: the soft haze above and below the disk.
in vec2 vUv; out vec4 o;
float cyl(float w, float R, float z, int oct){ return fbm3(vec3(cos(w) * R, sin(w) * R, z), oct); }
void main(){
  float phi = vUv.x * TAU, rho = vUv.y;
  // everything trails behind as it goes outward, in spirals that wander a little
  float wob = cyl(phi, .8, rho * 1.7 + 3., 3) - .5;
  float wob2 = cyl(phi + 2., 1.3, rho * 2.6 + 11., 3) - .5;
  float w = phi + rho * 8.5 + 2.4 * wob;
  // rings: bands that run all the way around, not quite circular
  float rr = rho + .020 * wob2 + .008 * sin(phi + 1.);
  float b1 = vn2(vec2(rr * 8., 3.7)), b2 = vn2(vec2(rr * 25., 8.1)), b3 = vn2(vec2(rr * 74., 1.3)), b4 = vn2(vec2(rr * 215., 5.9));
  float rings = (.30 + 1.4 * b1) * (.40 + 1.2 * b2) * (.55 + .9 * b3) * (.72 + .56 * b4);
  // streaks along the flow
  float s1 = cyl(w, 1.1, rho * 9. + 1.3, 5);
  float s2 = cyl(w + 1.7, 2.3, rho * 34. + 7.7, 6);
  float s3 = cyl(w + 4.1, 4.5, rho * 120. + 2.9, 5);
  float s4 = cyl(w + 2.6, 8., rho * 300. + 5.3, 3);
  float streaks = (.40 + 1.2 * s1) * (.35 + 1.3 * s2) * (.55 + .9 * s3) * (.75 + .5 * s4);
  float d = rings * streaks;
  // two broad spiral arms, and a few dark gaps
  d *= .80 + .36 * cos(2. * (phi + rho * 5.) + 4. * wob2);
  float gr = rr + .010 * (s2 - .5);

bake_terrain: `// Prepared once: the mountains as seen from the lake, stored as shape rather than as a picture, so they can be lit afresh
// every frame. First output: which way the ground faces, snow, and how high the black hole must stand to light this spot.
// Second output: distance, height, forest.
in vec2 vUv;
layout(location = 0) out vec4 o0;
layout(location = 1) out vec4 o1;
uniform sampler2D uHorizon;
void main(){
  float az = vUv.x * TAU, el = mix(EL0, EL1, vUv.y), te = tan(el);
  vec2 dir = vec2(sin(az), cos(az));
  vec4 hz = textureLod(uHorizon, vec2(vUv.x, .5), 0.);
  float t = hz.g;
  if (te < hz.r){
    // walk along the line of sight until it enters the ground, then narrow the spot down
    float ta = shore(az) * .9, tb = ta; bool hit = false;
    for (int i = uZero; i < 620; i++){
      float y = EYE + tb * te, h = terrainH(dir * tb, 7.);
      if (h > y){ hit = true; break; }
      ta = tb; tb = tb + max(tb * .0068 + 2., .35 * (y - h));
      if (tb > hz.g){ tb = hz.g; hit = true; break; }
    }
    for (int i = uZero; i < 9; i++){
      float tm = .5 * (ta + tb);
      if (terrainH(dir * tm, 9.) > EYE + tm * te) tb = tm; else ta = tm;
    }

  float e = max(1.5, t * .0007);
  float hc = terrainH(p, 10.);
  vec3 n = normalize(vec3(terrainH(p - vec2(e, 0.), 10.) - terrainH(p + vec2(e, 0.), 10.), 2. * e, terrainH(p - vec2(0., e), 10.) - terrainH(p + vec2(0., e), 10.)));

#define TAU 6.283185307179586
uniform sampler2D uNoise;
uniform int uZero;                 // always 0. Starting loops from it stops shader compilers from writing every round out in full, which made building the shaders very slow          // 256x256 random values; green is red shifted by (37,17), which makes 3D noise one lookup

uint ih(uint x){ x ^= x >> 16; x *= 0x7feb352dU; x ^= x >> 15; x *= 0x846ca68bU; x ^= x >> 16; return x; }
vec4 hash4(ivec3 c){
  uint h = ih(uint(c.x) + ih(uint(c.y) + ih(uint(c.z))));
  uint a = ih(h + 0x9e3779b9U), b = ih(a + 0x9e3779b9U), d = ih(b + 0x9e3779b9U);

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

float vn2(vec2 x){
  vec2 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);

}
float vn3(vec3 x){

float ridge3(vec3 p, int oct){

vec3 faintLayer(vec3 dc, int face, vec2 uv, float n, int L, float F, vec4 par, vec3 jx, vec3 jy, vec3 m){
  vec3 col = vec3(0.);
  vec2 c1 = floor((uv * .5 + .5) * n - .5);
  for (int j = uZero; j < 4; j++){
    vec2 ci = c1 + vec2(float(j & 1), float(j >> 1));
    if (ci.x < 0. || ci.y < 0. || ci.x > n - .5 || ci.y > n - .5) continue;
    vec4 h = hash4(ivec3(ivec2(ci), face * 16 + L));
    if (h.w >= par.z) continue;
    vec3 dv = dc - faceDir(face, (ci + h.xy) / n * 2. - 1.);
    float e = px2(dv, jx, jy, m) * par.x;
    if (e < 9.){
      vec4 k = hash4(ivec3(ivec2(ci) + ivec2(7919, 104729), face * 16 + L));
      float T = k.y < .62 ? mix(4800., 7800., k.z) : (k.y < .86 ? mix(3000., 4600., k.z) : mix(8500., 20000., k.z * k.z));
      float tw = 1. + par.y * sin(uTime * (3. + 7. * k.w) + k.z * 50.) * sin(uTime * 1.7 * (1. + k.x) + k.w * 30.);
      col += glow(T) * (F * pow(1. + 5.31 * k.x, par.w) * exp(-e) * tw);      // within a layer, too: many faint ones for each brighter one
    }
  }
  return col;
}
// jx, jy: how the direction into the sky changes from one pixel of the picture to the next; mu: how much the hole magnifies the sky here
vec3 stars(vec3 dc, float sinEl, vec3 jx, vec3 jy, float mu){
  float sig = max(uPix * .8, 2.5e-5);
  float inv2s2 = .5 / (sig * sig);
  float gain = pow(3.4e-4 / max(sig, 6.0e-5), 1.6);         // stars gather into sharper, brighter points as you zoom in
  gain *= clamp(sqrt(mu), .6, 2.5);                         // and where the hole magnifies the sky, it gathers more of a star's light
  float A = dot(jx, jx), B = dot(jx, jy), C = dot(jy, jy);
  vec3 m = vec3(C, B, A) / max(A * C - B * B, 1e-30);
  float reach = max(sig, min(.8 * sqrt(.5 * (A + C) + sqrt(.25 * (A - C) * (A - C) + B * B)), .02));   // how far over the sky a star's image reaches at most
  float pk = uPix * uPix;
  vec3 gd = uGal * dc, gjx = uGal * jx, gjy = uGal * jy;
  float tAmp = .10 + .55 * pow(1. - clamp(sinEl, 0., 1.), 4.);
  vec3 col = vec3(0.);
  int face; vec2 uv;
  // The stars the eye can see: each one real, at its true place, with its true brightness and colour.
  // The sky is divided into squares; a star's light reaches at most into the neighbouring squares, so the four around this point are looked at.
  float sr = min(sig, 1.2e-3), inv2r = .5 / (sr * sr);
  faceUV(gd, face, uv);
  vec2 c0 = floor((uv * .5 + .5) * SN - .5);
  for (int j = uZero; j < 4; j++){
    vec2 cj = c0 + vec2(float(j & 1), float(j >> 1));
    if (cj.x < 0. || cj.y < 0. || cj.x > SN - .5 || cj.y > SN - .5) continue;
    ivec2 at = ivec2(face * int(SN) + int(cj.x), int(cj.y));
    for (int s = uZero; s < 4; s++){
      vec4 st = texelFetch(uStarTex, at + ivec2(0, s * int(SN)), 0);
      if (st.z <= 0.) break;
      vec3 dv = gd - faceDir(face, (cj + st.xy) / SN * 2. - 1.);
      float e = px2(dv, gjx, gjy, m) * pk * inv2r;
      if (e < 9.){
        float ph = st.x * 61.7 + st.y * 37.3;
        float tw = 1. + tAmp * sin(uTime * (3. + 7. * fract(ph)) + ph * 5.) * sin(uTime * 1.7 * (1. + fract(ph * 3.3)) + ph * 3.);
        col += glow(st.w) * (uStarP.x * exp2(uStarP.y * (9.5 - st.z)) * exp(-e) * tw);
      }
    }
  }
  // The brightest are ringed by a soft glow, wider the brighter the star, as in a photograph: this is what lets the
  // constellations stand out from the crowd.
  vec2 b0 = floor((uv * .5 + .5) * BN - .5);
  float rh = max(2. * sig, .0048 * uTanH), fcut = exp2(uStarP.y * 1.8);       // (stars fainter than magnitude 4.7 have none)
  for (int j = uZero; j < 4; j++){
    vec2 cj = b0 + vec2(float(j & 1), float(j >> 1));
    if (cj.x < 0. || cj.y < 0. || cj.x > BN - .5 || cj.y > BN - .5) continue;
    ivec2 at = ivec2(face * int(BN) + int(cj.x), 4 * int(SN) + int(cj.y));
    for (int s = uZero; s < 4; s++){
      vec4 st = texelFetch(uStarTex, at + ivec2(0, s * int(BN)), 0);
      if (st.z <= 0.) break;
      vec3 dv = gd - faceDir(face, (cj + st.xy) / BN * 2. - 1.); float dd = length(dv);
      if (dd < .027) col += glow(st.w) * (uStarP.x * uStarP.w * max(exp2(uStarP.y * (9.5 - st.z)) - fcut, 0.) * exp(-sqrt(px2(dv, gjx, gjy, m)) * uPix / rh) * (1. - smoothstep(.019, .027, dd)));
    }
  }
  // The countless fainter ones continue where the eye leaves off: layer after layer, each two magnitudes fainter and
  // several times as many; crowded where the Milky Way is bright, sparse far from it and behind its dust.
  faceUV(dc, face, uv);
  float crowd = textureLod(uSky, vec2(atan(gd.y, gd.x) / TAU + .5, asin(clamp(gd.z, -1., 1.)) / PI + .5), 3.).a;
  float dens = clamp(.10 + 1.5 * crowd * crowd, .10, .93);
  float F = uStarP.x, step2 = exp2(-2. * uStarP.y), pw = -.7526 * uStarP.y;
  vec4 par = vec4(inv2s2 * pk, tAmp, dens, pw);
  for (int L = uZero; L < 5; L++){
    float n = LAYER_N[L];
    if ((PI * .5) / n < 9. * reach) break;                  // this layer's stars would stand too close together to tell apart
    col += faintLayer(dc, face, uv, n, L, F, par, jx, jy, m);
    // Close to an edge of its face of the sky, a point may also be reached by the light of stars just across that edge.
    if (abs(uv.x) > 1. - 1.1 / n){ int fb = faceBeside(face, 0, uv.x); col += faintLayer(dc, fb, faceUVon(dc, fb), n, L, F, par, jx, jy, m); }
    if (abs(uv.y) > 1. - 1.1 / n){ int fb = faceBeside(face, 1, uv.y); col += faintLayer(dc, fb, faceUVon(dc, fb), n, L, F, par, jx, jy, m); }
    F *= step2;
  }
  return col * gain;
}

// Two neighbours that reward a closer look, each where it really is.
vec3 deepSky(vec3 g){
  vec3 col = vec3(0.);
  // The Andromeda galaxy: a great spiral seen nearly edge-on, two and a half million light years away, with its two small companions.
  const vec3 A0 = vec3(-.4814, .7957, -.3677), AX = vec3(-.697, -.093, .712);
  vec3 w = g - A0;
  if (dot(w, w) < .0024){
    float x = dot(w, AX), y = dot(w, cross(A0, AX));          // along its length; across it, toward the side nearer to us
    vec2 q = vec2(x, y / .29);                                // looked at from above its disc
    float rd = length(q), rb = length(vec2(x, y / .64)), th = atan(q.y, q.x);
    float n = fbm3(vec3(q * 330., 3.) + 4., 4);
    // two arms wound tightly round the middle, with a thin lane of dust along the inside of each; the lanes show
    // plainest on the near side, where they stand in front of the light of the middle
    float ph = 2. * th - 9.5 * log(rd / .0030 + .4) + 1.7 * (n - .5);
    float arm = .5 + .5 * cos(ph);
    float lane = smoothstep(.50, 1., .5 + .5 * cos(ph + 1.15)) * smoothstep(.0018, .0048, rd) * (1. - smoothstep(.017, .027, rd));
    float near = mix(.40, 1., smoothstep(-.5, .5, q.y / (rd + 1e-6)));
    float disc = (exp(-rd / .0075) + .08 * exp(-rd / .020)) * (1. - smoothstep(.030, .046, rd));
    float ring = exp(-(rd - .0128) * (rd - .0128) / (2. * .0024 * .0024)) * (.7 + .6 * n);
    float knots = pow(vn3(vec3(q * 800., 7.)), 5.) * (ring + .5 * arm * disc) * 2.2;
    float dim = 1. - .60 * lane * near;
    col += vec3(1., .85, .64) * ((.60 * exp(-rb / .0016) + .13 * exp(-rb / .0048)) * mix(1., dim, smoothstep(.0012, .0040, rb)));
    col += (vec3(.80, .86, 1.) * (.15 * disc * (.70 + .60 * arm)) + vec3(.62, .78, 1.) * (.040 * ring + .05 * knots)) * dim;
    col += vec3(1., .88, .70) * (.35 * exp(-length(vec2(x + .00572, y + .00401)) / .00034));                        // M32, close in, small and round
    col += vec3(.95, .90, .82) * (.045 * exp(-length(vec2((x - .00094) / .55, y - .0106)) / .0016));                // M110, further out, a soft oval
  }
  // The great cluster in Hercules: several hundred thousand old stars in a ball. Close up it comes apart into single stars.
  const vec3 H0 = vec3(.3893, .6479, .6547);
  w = g - H0;
  if (dot(w, w) < 2.0e-5){
    vec3 hx = normalize(cross(H0, vec3(0., 0., 1.))), hy = cross(H0, hx);
    vec2 q = vec2(dot(w, hx), dot(w, hy));
    float r = length(q), prof = pow(1. + r * r / (.00030 * .00030), -1.25) * (1. - smoothstep(.0030, .0044, r));
    float sg = max(uPix * .8, 2.5e-5), res = smoothstep(9.0e-5, 4.0e-5, sg);     // how well single stars can be told apart at this zoom
    col += vec3(1., .90, .74) * (prof * mix(.42, .16, res));
    if (res > 0.){
      const float CS = 1.0e-4;
      vec2 c0 = floor(q / CS - .5);
      vec3 st = vec3(0.);
      for (int j = uZero; j < 4; j++){
        vec2 ci = c0 + vec2(float(j & 1), float(j >> 1));
        for (int k = uZero; k < 2; k++){                      // two stars to try in every little square
          vec4 h = hash4(ivec3(ivec2(ci) + 4096, 77 + k));
          vec2 sp = (ci + h.xy) * CS; float rs = length(sp);
          if (h.z > 1.5 * pow(1. + rs * rs / (.00042 * .00042), -.9) * (1. - smoothstep(.0016, .0041, rs))) continue;
          vec2 dv = q - sp; float e = dot(dv, dv) / (2. * sg * sg);
          if (e < 9.){
            vec4 h2 = hash4(ivec3(ivec2(ci) + 9001, 31 + k));
            st += glow(h2.x < .8 ? mix(4300., 5400., h2.y) : mix(7000., 9500., h2.y)) * (.45 * pow(max(h2.z, .012), -.85) * exp(-e));
          }
        }
      }
      col += st * (res * .55);
    }
  }
  return col;
}

// fp: how much sky one pixel covers here (near the hole the sky is stretched and squeezed)
vec3 milkyway(vec3 dc, float fp){
  vec3 g = uGal * dc;
  vec2 uv = vec2(atan(g.y, g.x) / TAU + .5, asin(clamp(g.z, -1., 1.)) / PI + .5);
  vec4 t = textureLod(uSky, uv, log2(max(fp / uSkyTexel, 1.)));
  vec3 col = t.rgb * t.rgb * uStarP.z;
  // Closer in than the map can show, its clouds break up into finer and finer grain. Each finer layer of grain joins
  // in only once it is several pixels wide, so nothing flickers and no pattern shows.
  float close = smoothstep(1.2, .3, fp / uSkyTexel);
  if (close > 0.){
    const mat3 TURN = mat3(.00, .80, .60, -.80, .36, -.48, -.60, -.48, .64);
    vec3 q = g * vec3(1., 1., 2.4) * 380. + 11.;
    float a = .5, f = 0., wide = 1. / (380. * fp);
    for (int i = uZero; i < 6; i++){
      float w = smoothstep(6., 16., wide);
      if (w > 0.) f += a * w * (vn3(q) - .5);
      q = TURN * q * 2. + 7.3; a *= .55; wide *= .5;
    }
    col *= 1. + close * t.a * t.a * 2.6 * f;
  }
  return col + deepSky(g) * (uStarP.z / .36);
}

// ---------- the black hole ----------
// How the gas moves: nearer the hole it turns faster. Two copies of the pattern, half a cycle apart, are
// cross-faded so the shearing never winds the picture up. Returns the two angles and the weight of the second.
const float FLOWP = 56.;
vec3 flow(float phi, float r){
  float om = (TAU / 120.) * pow(r / RIN, -1.5);
  float ph = uDiskT / FLOWP, f1 = fract(ph), f2 = fract(ph + .5);
  return vec3(phi - om * (f1 - .5) * FLOWP, phi - om * (f2 - .5) * FLOWP + 2.399, abs(2. * f1 - 1.));
}
vec3 blend2(vec3 m1, vec3 m2, float w2){                     // cross-fade that keeps the contrast
  float w1 = 1. - w2, nrm = inversesqrt(w1 * w1 + w2 * w2);
  const vec3 mean = vec3(.30, .16, .40);
  return max(mean + ((m1 - mean) * w1 + (m2 - mean) * w2) * nrm, 0.);
}
// how hot the gas looks from here: its own heat, shifted by its speed and by the hole's gravity
float heatAt(float r, float bz){
  float g = sqrt(1. - 1.5 / r) / (1. - sqrt(.5 / (r * r * r)) * bz);
  float x = max(r / RIN, 1.0001);
  float Tn = pow(x, -.75) * pow(1. - 1. / sqrt(x), .25) * 2.049;   // 1 at its hottest, a little outside the inner edge
  return Tn * g;
}
// a few bright knots circling with the gas, each trailing a tail
float knots(float phi, float r){
  float s = 0.;
  for (int i = 0; i < 3; i++){
    float fi = float(i), rs = 4.15 + 2.2 * fi;
    float dphi = phi - ((TAU / 120.) * pow(rs / RIN, -1.5) * uDiskT + fi * 2.3 + 1.);
    dphi -= TAU * floor(dphi / TAU + .5);
    float w = dphi < 0. ? .62 : .10, dr = (r - rs) / (.13 + .05 * fi);
    s += exp(-dphi * dphi / (w * w) - dr * dr);
  }
  return s;
}
// Light from one point of the thin disk. hp: the point; v: our line of sight there; dx, dy: how far the point
// moves from one pixel to the next; bz: how much the light circles the hole the way the gas turns.
vec4 diskSheet(vec3 hp, vec3 v, vec3 dx, vec3 dy, float bz){
  float r = length(hp);
  if (r < RIN || r > ROUT) return vec4(0.);
  vec3 er = hp / r, ep = cross(uDn, er);
  float phi = atan(dot(hp, uDy), dot(hp, uDx));
  float rho = log(r / RIN) / LOGR;
  if (uDbg > .5 && uDbg < 1.5) return vec4(vec3(fract(phi / TAU * 40.), fract(rho * 20.), .2) * .6, 1.);
  vec2 k = vec2(uDiskSize.x / (TAU * r), uDiskSize.y / (r * LOGR));
  vec2 gx = vec2(dot(dx, ep), dot(dx, er)) * k, gy = vec2(dot(dy, ep), dot(dy, er)) * k;
  float lraw = .5 * log2(max(max(dot(gx, gx), dot(gy, gy)), 1e-6)), lod = clamp(lraw, 0., 9.);
  vec3 f = flow(phi, r);
  vec3 m = blend2(textureLod(uDisk, vec2(f.x / TAU, rho), lod).rgb, textureLod(uDisk, vec2(f.y / TAU, rho), lod).rgb, f.z);
  // Finer and finer filaments, each fading in once a pixel is small enough to show it. Each is drawn out along
  // the flow, and each is checked against the size of a pixel in both directions, along the flow and across it.
  {
    float d1 = 0., d2 = 0.;
    for (int i = 0; i < 4; i++){
      vec2 K = i == 0 ? vec2(2., 4.3) : (i == 1 ? vec2(7., 9.5) : (i == 2 ? vec2(18., 23.) : vec2(45., 57.)));
      vec2 sc = K * 256. / uDiskSize, ax = gx * sc, ay = gy * sc;
      float l = .5 * log2(max(max(dot(ax, ax), dot(ay, ay)), 1e-8)), vis = clamp(1.2 - l, 0., 1.);
      if (vis > 0.){
        float ll = max(l, 0.), fi = float(i), amp = .52 - .07 * fi;
        d1 += amp * vis * (textureLod(uNoise, vec2(f.x / TAU * K.x, rho * K.y + fi * .37), ll).b - .5);
        d2 += amp * vis * (textureLod(uNoise, vec2(f.y / TAU * K.x + .5, rho * K.y + fi * .61), ll).a - .5);
      }
    }
    float w1 = 1. - f.z;
    m.r *= clamp(1. + 2.4 * (d1 * w1 + d2 * f.z) * inversesqrt(w1 * w1 + f.z * f.z), .15, 2.6);
  }
  float mu = max(abs(dot(normalize(v), uDn)), .10);
  float dens = m.r * m.r * 2.4 + m.r * .04;                  // how much gas we look through, seen face-on
  float alpha = 1. - exp(-dens / mu);
  float heat = heatAt(r, bz);
  float kn = knots(phi, r);
  vec3 c = glow(uTune.x * heat * (.90 + .30 * m.g + .25 * kn));
  float inten = pow(heat, uTune.y) * (.30 + 1.7 * m.r + 1.3 * m.g * m.r) * uTune.z * (1. + 2.4 * kn);
  return vec4(c * inten * alpha, alpha);
}

// What the sky shows along direction d: the disk's own light, and where the background is seen from.
vec3 lens(vec3 d, bool hidden, out vec3 dir, out float vis){
  dir = d; vis = 1.;
  vec3 h0 = vec3(0.), h1 = vec3(0.), h2 = vec3(0.), v0 = vec3(0.), v1 = vec3(0.), v2 = vec3(0.);
  vec3 z0 = vec3(0.), z1 = vec3(0.), z2 = vec3(0.), z3 = vec3(0.);       // haze light gathered before each crossing of the disk
  int nh = 0;
  float c = dot(d, uBH), bz = 0.;
  vec3 pos = -uBH * uBHd;
  vec3 hv = cross(pos, d);
  float hh = dot(hv, hv), b = sqrt(hh);
  if (c > 0. && b < BMAX && !hidden){
    vec3 perp = normalize(uBH - d * c + 1e-6);
    vec3 far = normalize(d + perp * tan(min((1. + c) / max(b, .001), 1.)));   // gentle bending far from the hole
    vec3 vel = d;
    bz = -dot(hv, uDn);
    float esc = 0.;
    float r2 = dot(pos, pos);
    vec3 acc = -1.5 * hh * pos / (r2 * r2 * sqrt(r2));
    float rEsc2 = (uBHd + 2.) * (uBHd + 2.);
    vec3 f = vec3(0.);
    for (int i = uZero; i < 190; i++){
      if (r2 < 1.){ vis = 0.; esc = 1.; break; }                               // fell in
      if (r2 > rEsc2 && dot(pos, vel) > 0.){ esc = 1.; break; }                // got away
      float r = sqrt(r2);
      float dt = .04 + .11 * abs(r - 1.5) + .07 * max(r - 6., 0.);
      float s0 = dot(pos, uDn), vz = dot(vel, uDn);
      if (r > RIN * .8 && r < ROUT + 1.5){                                     // tread carefully through the haze
        float H2 = 2. * HZ * r, az = abs(s0), avz = abs(vz) + 1e-4;
        if (az < H2) dt = min(dt, max(.36 * H2 / avz, .02));
        else if (s0 * vz < 0.) dt = min(dt, max((az - H2 * .82) / avz, .02));
      }
      vec3 p0 = pos, w0 = vel;
      pos += vel * dt + acc * (.5 * dt * dt);
      r2 = dot(pos, pos);
      vec3 a1 = -1.5 * hh * pos / (r2 * r2 * sqrt(r2));
      vel += (acc + a1) * (.5 * dt); acc = a1;
      float s1 = dot(pos, uDn);
      // haze: sampled half-way along the step
      vec3 pm = .5 * (p0 + pos); float rm = length(pm), zm = .5 * (s0 + s1), q = zm / (2. * HZ * rm);
      if (rm > RIN && rm < ROUT && abs(q) < 1.){
        float phi = atan(dot(pm, uDy), dot(pm, uDx)), rho = log(rm / RIN) / LOGR;
        if (i == 0) f = flow(phi, rm); else f = flow(phi, rm);
        float hzv = mix(textureLod(uDisk, vec2(f.x / TAU, rho), 3.5).b, textureLod(uDisk, vec2(f.y / TAU, rho), 3.5).b, f.z);
        float prof = (1. - q * q); prof *= prof;
        float heat = heatAt(rm, bz);
        vec3 e = glow(uTune.x * heat) * (pow(heat, uTune.y) * hzv * prof * dt * length(vel) / (HZ * rm) * uTune.w);
        if (nh == 0) z0 += e; else if (nh == 1) z1 += e; else if (nh == 2) z2 += e; else z3 += e;
      }
      if (s0 * s1 < 0. && nh < 3){
        // where exactly the path pierces the disk: a smooth curve through both ends of the step
        float m0 = dot(w0, uDn) * dt, m1 = dot(vel, uDn) * dt, tau = s0 / (s0 - s1);
        for (int j = 0; j < 3; j++){
          float t2 = tau * tau, t3 = t2 * tau;
          float fv = (2. * t3 - 3. * t2 + 1.) * s0 + (t3 - 2. * t2 + tau) * m0 + (3. * t2 - 2. * t3) * s1 + (t3 - t2) * m1;
          float df = (6. * t2 - 6. * tau) * (s0 - s1) + (3. * t2 - 4. * tau + 1.) * m0 + (3. * t2 - 2. * tau) * m1;
          tau = clamp(tau - fv / (abs(df) > 1e-6 ? df : 1e-6), 0., 1.);
        }
        float t2 = tau * tau, t3 = t2 * tau;
        vec3 hp = (2. * t3 - 3. * t2 + 1.) * p0 + (t3 - 2. * t2 + tau) * dt * w0 + (3. * t2 - 2. * t3) * pos + (t3 - t2) * dt * vel;
        vec3 hvv = mix(w0, vel, tau);
        if (nh == 0){ h0 = hp; v0 = hvv; } else if (nh == 1){ h1 = hp; v1 = hvv; } else { h2 = hp; v2 = hvv; }
        nh++;
      }
      if (r2 > rEsc2 && dot(pos, vel) > 0.){                                   // got away. Its direction is read off exactly at the edge, not after
        float ra = length(p0);                                                 // a whole number of steps: so it changes smoothly from one line of
        vel = mix(w0, vel, clamp((sqrt(rEsc2) - ra) / max(sqrt(r2) - ra, 1e-4), 0., 1.));   // sight to the next, and nothing in the sky is torn
        esc = 1.; break;
      }
    }
    if (esc < .5) vis = 0.;
    dir = normalize(mix(normalize(vel), far, smoothstep(BMAX - 5., BMAX, b)));
  } else {                                                    // far from the hole, and all the way round the sky, its pull still bends the light a little
    vec3 perp = normalize(uBH - d * c + 1e-6);
    dir = normalize(d + perp * tan(min((1. + c) / max(b, .001), 1.)));
  }
  // light of the disk itself, nearest crossing first
  vec4 e0 = diskSheet(h0, v0, dFdx(h0), dFdy(h0), bz);
  vec4 e1 = diskSheet(h1, v1, dFdx(h1), dFdy(h1), bz);
  vec4 e2 = diskSheet(h2, v2, dFdx(h2), dFdy(h2), bz);
  if (uDbg > 3.5 && uDbg < 4.5){ e1 = vec4(0.); e2 = vec4(0.); }
  if (uDbg > 4.5 && uDbg < 5.5){ z0 = z1 = z2 = z3 = vec3(0.); }
  if (uDbg > 5.5 && uDbg < 6.5){ e0 = e1 = e2 = vec4(0.); }
  vec3 em = z0 + e0.rgb + (1. - e0.a) * (z1 + e1.rgb + (1. - e1.a) * (z2 + e2.rgb + (1. - e2.a) * z3));
  vis *= (1. - e0.a) * (1. - e1.a) * (1. - e2.a);
  return em;
}

// ---------- the air ----------
// its own faint glow low down, and the black hole's light scattered around it
vec3 air(vec3 d){
  vec3 col = vec3(.0016, .0028, .0040) / (d.y + .22);
  vec3 bh = normalize(vec3(uBH.x, max(uBH.y, .03), uBH.z));
  float th = acos(clamp(dot(d, bh), -1., 1.));
  float tw = smoothstep(-.30, .06, uBH.y) * uBHlum;
  return col + uBHtint * tw * (.014 * exp(-th * 3.2) + .004 * exp(-th * 1.1)) * (1. + 2.2 * exp(-d.y * 9.));
}

// ---------- aurora ----------
// Curtains of light hanging 100 to 300 km up: thin folded sheets, far longer than they are thick. Along the line
// of sight the light gathered from each sheet is worked out exactly piece by piece, which keeps the folds crisp
// and makes them brighten where a fold is seen edge-on, as real curtains do.
uniform float uAurK; uniform int uAurN;
const float RE = 6371.;
const vec2 AUR_A = vec2(.8829, .4695), AUR_L = vec2(-.4695, .8829);   // along the curtains (x, z), and across them
float erfa(float x){ float a = abs(x), q = 1. + a * (.278393 + a * (.230389 + a * (.000972 + a * .078108))); q *= q; q *= q; return sign(x) * (1. - 1. / q); }
// Light gathered along a stretch whose two ends lie q0 and q1 sheet-thicknesses from the sheet:
// I is how much, tc is where along the stretch (0..1) it mostly comes from.
void gather(float q0, float q1, out float I, out float tc){
  float dq = q1 - q0;
  if (abs(dq) < .08){ float qm = .5 * (q0 + q1); I = exp(-qm * qm); tc = .5; return; }
  I = .8862269 * (erfa(q1) - erfa(q0)) / dq;
  float M = (exp(-q0 * q0) - exp(-q1 * q1)) / (2. * dq);
  tc = clamp((M / max(I, 1e-6) - q0) / dq, 0., 1.);
}
float curtain(float s, float h, float c, float p1, float p2, float p3, float a2, float a3){
  return c + 34. * sin(s * .0232 + p1 + .8 * sin(s * .0071 + p2)) + a2 * sin(s * .101 + p2 + 1.3 * sin(s * .023 + p3)) + a3 * sin(s * .43 + p3 + 2.2 * sin(s * .061 + p1)) + .16 * (h - 100.);
}
// light of one curtain gathered between two points of the line of sight
vec3 curtainLight(float ta, float fa, float tb, float fb, float ds, float dy, float k, float fj, float amp, float tm){
  vec3 col = vec3(0.);
  float dtk = tb - ta, I2, tc2;
  gather(fa / 18., fb / 18., I2, tc2);
  if (I2 < 1e-4) return col;
  float t2 = mix(ta, tb, tc2), s2 = ds * t2, h2 = dy * t2 + .5 * k * t2 * t2;
  float env = smoothstep(.30, .62, vn2(vec2(s2 * .0061 + tm * .0052 + fj * 3.3, 23.1))) * smoothstep(1150., 500., abs(s2));
  // a soft glow around the curtain
  float u2 = h2 - 100., hr2 = (h2 - 235.) / 60.;
  col += (vec3(.10, 1., .33) * (smoothstep(-16., 24., u2) * exp(-max(u2, 0.) / 48.)) + vec3(1., .07, .10) * (.10 * exp(-hr2 * hr2))) * (I2 * dtk * amp * env * .085);
  // the curtain itself
  float I1, tc1;
  gather(fa / 1.9, fb / 1.9, I1, tc1);
  if (I1 < 1e-4) return col;
  // Where the line of sight runs inside the curtain for a long stretch, it passes many rays; look at several
  // points of that stretch so they blend instead of flickering.
  float qa = fa / 1.9, dq = fb / 1.9 - qa, lo = 0., hi = 1.;
  if (abs(dq) > 1e-3){ float u0 = (-1.6 - qa) / dq, u1 = (1.6 - qa) / dq; lo = clamp(min(u0, u1), 0., 1.); hi = clamp(max(u0, u1), 0., 1.); }
  if (hi - lo < 1e-4){ lo = tc1; hi = tc1; }
  float along = abs(ds) * dtk * (hi - lo);
  float ns = clamp(ceil(along / 2.6), 1., uAurN > 50 ? 12. : 8.), each = along / ns;
  // fine streaks closer together than these points blend into their average; the broad bundles are always resolved
  float k1 = clamp(3.8 / each - .6, 0., 1.), k3 = clamp(1.3 / each - .6, 0., 1.);
  vec3 acc = vec3(0.);
  for (float q = 0.; q < ns; q += 1.){
    float t1 = mix(ta, tb, ns < 1.5 ? tc1 : mix(lo, hi, (q + .5) / ns)), s = ds * t1, h = dy * t1 + .5 * k * t1 * t1;
    // rays: fine upright streaks; some reach much higher than others
    float r1 = mix(.5, vn2(vec2(s * .42 + tm * (.16 + .05 * fj), 3.7 + fj * 9.)), k1);
    float r2 = vn2(vec2(s * .093 - tm * .045, 11.3 + fj * 5.));
    float r3 = mix(.5, vn2(vec2(s * 1.37 - tm * .31, 17.9 + fj * 3.)), k3);
    float ray = r1 * (.40 + 1.2 * r2) * (.7 + .6 * r3);
    float tall = smoothstep(.15, .95, r2 * (.55 + .9 * vn2(vec2(s * .031 + tm * .008, 41.7 + fj * 2.))));   // bundles of rays that reach high
    float up = h - (97. + 5. * vn2(vec2(s * .016, 31. + fj)));
    float green = smoothstep(0., 3.2, up) * exp(-max(up, 0.) / (12. + 95. * tall * tall)) * (1. + 1.6 * exp(-max(up, 0.) / 7.));
    float hr = (h - 240.) / 58.;
    float red = .13 * exp(-hr * hr) * (.3 + ray);
    float hv2 = (up - 1.1) / 1.7;
    float violet = .50 * exp(-hv2 * hv2);
    float lit = smoothstep(.30, .62, vn2(vec2(s * .0061 + tm * .0052 + fj * 3.3, 23.1))) * smoothstep(1150., 500., abs(s));   // which stretches of the curtain are alight
    acc += (vec3(.10, 1., .33) * green + vec3(1., .07, .10) * red + vec3(.50, .16, 1.) * violet) * ((.25 + 1.7 * ray) * lit);
  }
  return col + acc * (I1 * dtk * amp / ns);
}
vec3 aurora(vec3 d){
  float dh = length(d.xz), k = dh * dh / RE;
  float tA = 2. * 88. / (d.y + sqrt(d.y * d.y + 2. * k * 88.)), tB = 2. * 300. / (d.y + sqrt(d.y * d.y + 2. * k * 300.));
  float ds = dot(d.xz, AUR_A), dl = dot(d.xz, AUR_L);
  vec3 col = vec3(0.);
  float tm = uTime, nmax = float(uAurN);
  // Where a curtain is followed in steps, the steps would show as faint rungs across it. Starting them at a different
  // point for every pixel and every moment turns the rungs into a grain too fine to see.
  float jit = hash12(gl_FragCoord.xy + fract(uTime * 5.13) * 191.);
  for (int j = 0; j < 3; j++){
    float fj = float(j);
    float cj = j == 0 ? 46. : (j == 1 ? 158. : -135.);
    float amp = j == 0 ? 1. : (j == 1 ? .8 : .9);
    // only the stretch of the line of sight that passes within 150 km of this curtain is followed
    float t0 = tA, t1 = tB;
    if (abs(dl) > 1e-4){
      float u0 = (cj - 150.) / dl, u1 = (cj + 150.) / dl;
      t0 = max(tA, min(u0, u1)); t1 = min(tB, max(u0, u1));
    } else if (abs(cj) > 150.) continue;
    if (t1 <= t0) continue;
    // Steps of about 5 km along the curtain, so its folds keep their shape; where that would take too many
    // steps, the folds smaller than a step are left out, so nothing flickers.
    float len = t1 - t0;
    float n = clamp(ceil(max(abs(ds) * len / 5., abs(dl) * len / 25.)), 4., nmax);
    float stepS = abs(ds) * len / n;
    float a3 = 1.7 * clamp(2.4 - stepS / 4.5, 0., 1.), a2 = 8. * clamp(2.4 - stepS / 20., 0., 1.);
    int steps = int(n + .5);
    float p1 = fj * 2.1 + tm * .017, p2 = fj * 4.7 - tm * .043, p3 = fj * 1.3 + tm * .11;
    float tp = t0;
    float fp = dl * tp - curtain(ds * tp, d.y * tp + .5 * k * tp * tp, cj, p1, p2, p3, a2, a3);
    for (int i = 1; i <= steps + 1; i++){
      float tn = t0 + len * clamp((float(i) - jit) / n, 0., 1.);   // (the steps begin at a different point for every pixel and every moment)
      if (tn - tp < 1e-5) continue;
      float fn = dl * tn - curtain(ds * tn, d.y * tn + .5 * k * tn * tn, cj, p1, p2, p3, a2, a3);
      if (fp * fn < 0.){
        // the line of sight pierces the curtain here: look closer, twice
        float t1 = mix(tp, tn, fp / (fp - fn));
        float f1 = dl * t1 - curtain(ds * t1, d.y * t1 + .5 * k * t1 * t1, cj, p1, p2, p3, a2, a3);
        bool left = fp * f1 < 0.;
        float ta = left ? tp : t1, fa = left ? fp : f1, tb = left ? t1 : tn, fb = left ? f1 : fn;
        float t2 = mix(ta, tb, fa / (fa - fb));
        float f2 = dl * t2 - curtain(ds * t2, d.y * t2 + .5 * k * t2 * t2, cj, p1, p2, p3, a2, a3);
        if (left){
          col += curtainLight(tp, fp, t2, f2, ds, d.y, k, fj, amp, tm) + curtainLight(t2, f2, t1, f1, ds, d.y, k, fj, amp, tm) + curtainLight(t1, f1, tn, fn, ds, d.y, k, fj, amp, tm);
        } else {
          col += curtainLight(tp, fp, t1, f1, ds, d.y, k, fj, amp, tm) + curtainLight(t1, f1, t2, f2, ds, d.y, k, fj, amp, tm) + curtainLight(t2, f2, tn, fn, ds, d.y, k, fj, amp, tm);
        }
      } else if (min(abs(fp), abs(fn)) < 60.) col += curtainLight(tp, fp, tn, fn, ds, d.y, k, fj, amp, tm);
      tp = tn; fp = fn;
    }
  }
  return col * uAurK * .017;
}

// ---------- firs along the shore ----------
// Three rows of trees where the water ends. u: direction (0..1 around), te: slope of the line of sight, S: distance to the shore.
float firs(float u, float te, float S){
  float cov = 0.;
  for (int row = 0; row < 3; row++){
    float fr = float(row), D = S * (1. + .06 * fr) + 25. * fr;
    float base = (1.5 + 10. * fr - uCamH) / D, sp = 6.5 + 2. * fr;
    float x = u * TAU * D / sp, xi = floor(x), aa = uPix * D / sp * .7;
    if (te < base || te > base + 34. / D) continue;
    for (int k = -1; k <= 1; k++){
      float id = xi + float(k);
      vec4 h = hash4(ivec3(int(id), row, 77));
      float Hm = (13. + 17. * h.y) * (.55 + .9 * vn2(vec2(u * 46., 4.4 + fr)));
      float y = (te - base) * D / Hm;
      if (y < 1.){
        float jag = .70 + .30 * abs(fract(y * (6. + 5. * h.w) + h.z) * 2. - 1.);
        float w = .21 * Hm / sp * (1. - y) * jag + .02;
        cov = max(cov, smoothstep(w + aa, w - aa, abs(x - (id + .5 + (h.x - .5) * .9))) * smoothstep(1., .96, y));
        cov = max(cov, smoothstep(.34 + .2 * h.z, .22 + .2 * h.z, y));       // undergrowth and the trees behind close the gaps low down
      }
    }
  }
  return cov;
}

// ---------- the lamps of the house on the far shore ----------
uniform vec3 uHome, uHomeX, uHomeZ, uHomeC;   // where the house stands, the directions of its long wall and of its front, and the middle of the whole place
uniform vec3 uJetX, uJetZ;                    // the landing stage: its width and its length, pointing out into the lake
uniform vec3 uLampP, uLampL, uLampW;          // the lamp over the door, the lantern at the end of the landing stage, the lit window
float fire(){ return 1. + .05 * sin(uTime * 9.1) * sin(uTime * 5.3) + .03 * sin(uTime * 23.); }   // the window is lit by a fire: it flickers a little
// their light on a surface nearby
vec3 lampLight(vec3 p, vec3 n){
  vec3 c = vec3(0.), v = uLampP - p; float r2 = dot(v, v);
  if (r2 > 14400.) return c;
  c += vec3(1., .60, .26) * (2.6 * max(dot(n, v) * inversesqrt(r2), 0.) + .12) / (r2 + .4);
  v = uLampL - p; r2 = dot(v, v);
  c += vec3(1., .66, .32) * (1.8 * max(dot(n, v) * inversesqrt(r2), 0.) + .10) / (r2 + .4);
  v = uLampW - p; r2 = dot(v, v);
  float fw = max(dot(-v, uHomeZ) * inversesqrt(r2), 0.);                   // the window throws its light forward
  c += vec3(1., .58, .24) * (fire() * 9. * fw * fw * max(dot(n, v) * inversesqrt(r2), 0.)) / (r2 + 1.);
  return c;
}

// ---------- land ----------
uniform sampler2D uL0, uL1;          // what stands on land, worked out a moment ago for every direction of a view
uniform vec3 uLAx, uLR, uLU;         // that view: where it looked, its right and its up
uniform vec4 uLView;                 // its shift (xy), its half-width and half-height (zw)
uniform float uLOn;
// what stands on land in direction d, if that view covered the direction (a mirrored direction usually lies in it too)
bool landAt(vec3 d, out vec4 g0, out vec4 g1){
  float fz = dot(d, uLAx);
  if (uLOn < .5 || fz <= 1e-4) return false;
  vec2 sp = (vec2(dot(d, uLR), dot(d, uLU)) / fz - uLView.xy) / uLView.zw * .5 + .5;
  if (sp.x <= 0. || sp.y <= 0. || sp.x >= 1. || sp.y >= 1.) return false;
  g0 = textureLod(uL0, sp, 0.); g1 = textureLod(uL1, sp, 0.);
  if (g0.y > .004){ float k = 1. / g0.y; g0.xzw *= k; g1 *= k; }              // (everything is stored multiplied by the share of the pixel that land covers)
  return true;
}
// the air between us and something far away dims it and adds its own faint light
vec3 airBetween(vec3 col, vec3 d, float dist){
  float clear = exp(-dist / 8500.);
  vec3 bhd = normalize(uBH + vec3(0., .02, 0.));
  float ph = .06 / pow(1.36 - 1.2 * dot(normalize(d), bhd), 1.5);
  return col * clear + (vec3(.0040, .0064, .0098) + uBHtint * uBHup * (.007 + .075 * ph)) * (1. - clear);
}
// colour of a piece of land: lit by the black hole where it stands above the mountains in its way, by the sky everywhere
vec3 landColour(vec3 d, vec3 n, float snow, float trees, float tone, float ao, float hor, float dist){
  vec3 rock = mix(vec3(.105, .100, .096), vec3(.27, .245, .215), tone);
  vec3 albedo = mix(mix(rock, mix(vec3(.026, .042, .028), vec3(.062, .086, .050), tone), trees), vec3(.82, .86, .93), snow);
  float lit = smoothstep(-.07, .12, uBH.y - hor) * uBHup;
  float wrap = mix(.22, .80, trees);                           // light reaches round a tree's soft masses of needles further than round rock
  float ndl = max((dot(n, uBH) + wrap) / (1. + wrap), 0.) * mix(1., .62, trees);
  vec3 skyLight = (vec3(.0200, .0320, .0550) + vec3(.0065, .0490, .0230) * uAurK) * (.30 + .70 * n.y) * ao;   // starlight, and the green of the aurora
  vec3 col = albedo * (uBHtint * (lit * ndl * .42 * mix(.5 + .5 * ao, ao * ao, trees)) + skyLight);   // (little direct light finds its way in among the trees and down to the forest floor)
  col += albedo * lampLight(vec3(0., uCamH, 0.) + normalize(d) * dist, n);
  float F = uPix * dist;
  if (snow > .3 && F < .12){                                   // snow crystals catching the light: only for those who look very closely
    vec3 p = d * dist * 3., c = floor(p);
    float hsh = hash12(c.xz + c.y * 7.);
    if (hsh > .994){                                           // one crystal in a rare spot: a point of light, however close one looks
      vec3 q = (p - c - .5) / 3.; float sg = max(1.3 * F, .05);
      float glint = exp(-dot(q, q) / (2. * sg * sg)) * (.5 + .5 * sin(uTime * (2. + 9. * fract(hsh * 71.)) + hsh * 40.));
      col += uBHtint * (lit * snow * glint * mix(1.1, .6, trees) * (1. - smoothstep(.03, .12, F)));
    }
  }
  return airBetween(col, d, dist);
}
// cov: how much of this pixel the land covers. Returns its colour.
vec3 mountains(vec3 d, out float cov, out float dist){
  float u = atan(d.x, d.z) / TAU, te = d.y / length(d.xz);
  vec2 uv = vec2(u, clamp((atan(te) - EL0) / (EL1 - EL0), 0., 1.));
  vec4 g0, g1;
  if (landAt(d, g0, g1)){
    cov = g0.y; dist = max(g0.x, 1.);
    if (cov <= .004){ cov = 0.; return vec3(0.); }
    vec3 n = vec3(g0.z, sqrt(max(1. - g0.z * g0.z - g0.w * g0.w, 0.)), g0.w);
    return landColour(d, n, g1.x, g1.y, g1.z, g1.w, (textureLod(uTerrA, uv, 0.).w - .25) / 1.25, dist);
  }
  // outside the picture (a reflection of something above its top edge, say): the coarser prepared panorama
  vec4 hz = textureLod(uHorizon, vec2(u, .5), 0.);
  dist = hz.g;
  float rough = (vn2(vec2(u * 9000., 3.)) - .5) * 14. + (vn2(vec2(u * 31000., 7.)) - .5) * 6. + (vn2(vec2(u * 110000., 5.)) - .5) * 2.5;
  float edge = hz.r + rough / hz.g - te;
  float aa = uPix * .8;
  cov = smoothstep(-aa, aa, edge);
  float S = shore(u * TAU);
  float tr = te < 40. / S ? firs(u, te, S) : 0.;
  if (cov <= 0. && tr <= 0.) return vec3(0.);
  vec4 A = textureLod(uTerrA, uv, 0.), B = textureLod(uTerrB, uv, 0.);
  vec3 n = vec3(A.x * 2. - 1., 0., A.y * 2. - 1.); n.y = sqrt(max(1. - dot(n.xz, n.xz), 0.));
  float hor = (A.w - .25) / 1.25;
  dist = 800. * exp(B.x * 4.1);
  vec3 col = landColour(d, n, A.z, B.z, .5, 1., hor, dist);
  if (tr > 0.){                                              // the trees stand in front of everything else on land
    col = mix(col, landColour(d, vec3(0., 1., 0.), 0., 1., .5, 1., hor, S), tr);
    dist = mix(dist, S, tr); cov = max(cov, tr);
  }
  return col;
}

// ---------- the house on the far shore ----------
// A small house with a lit window, a landing stage with a lantern, and a boat. From across the lake it is a single
// warm point of light; it has to be looked for.
float boxHit(vec3 o, vec3 d, vec3 c, vec3 hs, out vec3 n){
  vec3 m = 1. / d, k = abs(m) * hs, t1 = -m * (o - c) - k, t2 = -m * (o - c) + k;
  float tN = max(max(t1.x, t1.y), t1.z), tF = min(min(t2.x, t2.y), t2.z);
  n = -sign(d) * step(t1.yzx, t1.xyz) * step(t1.zxy, t1.xyz);
  return tN > tF || tF < 0. ? -1. : tN;
}
void clipP(vec3 o, vec3 d, vec3 pn, float pd, inout float tN, inout float tF, inout vec3 nn){
  float dn = dot(pn, d), on = dot(pn, o) - pd;
  if (abs(dn) < 1e-7){ if (on > 0.) tF = -1e9; return; }
  float t = -on / dn;
  if (dn < 0.){ if (t > tN){ tN = t; nn = pn; } } else tF = min(tF, t);
}
float roofHit(vec3 o, vec3 d, out vec3 n){             // a gable roof under snow: ridge along the house, eaves reaching past the walls
  float tN = -1e9, tF = 1e9; n = vec3(0.);
  clipP(o, d, normalize(vec3(0., 3.2, 2.0)), dot(normalize(vec3(0., 3.2, 2.0)), vec3(0., 4.55, 0.)), tN, tF, n);
  clipP(o, d, normalize(vec3(0., 3.2, -2.0)), dot(normalize(vec3(0., 3.2, -2.0)), vec3(0., 4.55, 0.)), tN, tF, n);
  clipP(o, d, vec3(0., -1., 0.), -2.55, tN, tF, n);
  clipP(o, d, vec3(1., 0., 0.), 4.0, tN, tF, n);
  clipP(o, d, vec3(-1., 0., 0.), 4.0, tN, tF, n);
  return tN < tF && tN > 0. ? tN : -1.;
}
float overlap(float x, float hw, float pf){ return clamp((min(hw, x + .5 * pf) - max(-hw, x - .5 * pf)) / pf, 0., 1.); }
// one line of sight against the house, the landing stage and the boat: colour and whether anything was met
vec4 homeRay(vec3 ro, vec3 rd, bool mirror, out float tHit){
  vec3 r0 = ro - uHome;
  vec3 o = vec3(dot(r0, uHomeX), r0.y, dot(r0, uHomeZ)), d = vec3(dot(rd, uHomeX), rd.y, dot(rd, uHomeZ));
  vec3 jo = vec3(dot(r0, uJetX), r0.y, dot(r0, uJetZ)), jd = vec3(dot(rd, uJetX), rd.y, dot(rd, uJetZ));
  d += step(abs(d), vec3(1e-6)) * 1e-6; jd += step(abs(jd), vec3(1e-6)) * 1e-6;
  float t = 1e9, tt; vec3 n = vec3(0.), nn; int id = 0;
  tt = boxHit(o, d, vec3(0., 1.3, 0.), vec3(3.5, 1.3, 2.5), nn); if (tt > 0. && tt < t){ t = tt; n = nn; id = 1; }            // walls
  tt = roofHit(o, d, nn); if (tt > 0. && tt < t){ t = tt; n = nn; id = 2; }                                                 // roof
  tt = boxHit(o, d, vec3(-2.1, 4.25, -.7), vec3(.36, .8, .36), nn); if (tt > 0. && tt < t){ t = tt; n = nn; id = 3; }        // chimney
  tt = boxHit(jo, jd, vec3(0., .15, 33.), vec3(.75, .06, 9.), nn); if (tt > 0. && tt < t){ t = tt; n = nn; id = 4; }         // the landing stage
  tt = boxHit(jo, jd, vec3(.62, .75, 41.5), vec3(.06, .78, .06), nn); if (tt > 0. && tt < t){ t = tt; n = nn; id = 5; }      // the post that carries the lantern
  tt = boxHit(jo, jd, vec3(-.62, -.3, 36.), vec3(.07, .5, .07), nn); if (tt > 0. && tt < t){ t = tt; n = nn; id = 5; }
  tt = boxHit(jo, jd, vec3(.62, -.3, 30.), vec3(.07, .5, .07), nn); if (tt > 0. && tt < t){ t = tt; n = nn; id = 5; }
  { // the boat: a shallow hull lying at the landing stage
    vec3 rr = vec3(.72, .44, 2.25), bo = (jo - vec3(-1.75, .10, 37.5)) / rr, bd = jd / rr;
    float a = dot(bd, bd), b2 = dot(bo, bd), c2 = dot(bo, bo) - 1., disc = b2 * b2 - a * c2;
    if (disc > 0.){
      float sq = sqrt(disc), ta = (-b2 - sq) / a, tb = (-b2 + sq) / a;
      vec3 pa = bo + bd * ta, pb = bo + bd * tb;
      if (ta > 0. && ta < t && pa.y < .62){ t = ta; n = normalize(pa / rr); id = 6; }                  // its outside
      else if (tb > 0. && tb < t && pb.y < .62 && pa.y >= .62){ t = tb; n = -normalize(pb / rr); id = 7; }   // looking into it over the rim
    }
  }
  tHit = -1.;
  if (id == 0) return vec4(0.);
  tHit = t;
  if (uDbg > 12.5 && uDbg < 13.5) return vec4(vec3(float(id & 1), float((id >> 1) & 1), float((id >> 2) & 1)) * .5 + .1, 1.);
  vec3 pw = ro + rd * t, lp = id < 4 ? o + d * t : jo + jd * t;
  vec3 nw = id < 4 ? n.x * uHomeX + vec3(0., n.y, 0.) + n.z * uHomeZ : n.x * uJetX + vec3(0., n.y, 0.) + n.z * uJetZ;
  vec3 albedo = vec3(.075, .056, .042), glow = vec3(0.);
  if (id == 1){                                                            // walls of dark logs
    albedo *= .75 + .5 * smoothstep(.1, .4, abs(fract(lp.y / .27) - .5) * 2.);
    if (n.z > .5){
      vec2 w = lp.xy - vec2(1.25, 1.45);                                   // the window: firelight behind four panes
      if (abs(w.x) < .64 && abs(w.y) < .50){
        float bars = smoothstep(.03, .06, abs(w.x)) * smoothstep(.03, .06, abs(w.y)) * smoothstep(.64, .59, abs(w.x)) * smoothstep(.50, .45, abs(w.y));
        glow = vec3(1., .58, .22) * (6.5 * fire() * bars * (.55 + .45 * exp(-dot(w - vec2(.1, -.2), w - vec2(.1, -.2)) * 3.)));
        albedo = vec3(.02);
      }
      vec2 dr = lp.xy - vec2(-1.3, 1.05);                                  // the door
      if (abs(dr.x) < .46 && abs(dr.y) < 1.05) albedo = vec3(.05, .036, .026) * (.8 + .4 * smoothstep(.02, .05, abs(fract(dr.x / .23) - .5)));
    } else if (n.x > .5){
      vec2 w = lp.zy - vec2(-.2, 1.5);                                     // a smaller window in the side wall
      if (abs(w.x) < .40 && abs(w.y) < .42){ glow = vec3(1., .56, .20) * (2.2 * fire() * smoothstep(.02, .04, abs(w.x)) * smoothstep(.40, .36, abs(w.x)) * smoothstep(.42, .38, abs(w.y))); albedo = vec3(.02); }
    }
  }
  else if (id == 2) albedo = n.y > .1 ? vec3(.80, .84, .90) * (.9 + .1 * vn2(lp.xz * 3.)) : vec3(.06, .045, .035);   // snow on the roof, timber under the eaves
  else if (id == 3) albedo = lp.y > 4.95 ? vec3(.74, .78, .84) : vec3(.11, .10, .095) * (.7 + .6 * vn2(lp.xy * 6. + lp.z * 4.));
  else if (id == 4) albedo = vec3(.085, .066, .05) * (.7 + .5 * smoothstep(.03, .1, abs(fract(lp.z / .22) - .5)));     // planks
  else if (id == 6) albedo = lp.y > .22 ? vec3(.16, .15, .13) : vec3(.11, .035, .028);                                // the boat: a pale rim, a red hull
  else if (id == 7) albedo = vec3(.07, .055, .045);
  float ndl = max((dot(nw, uBH) + .22) / 1.22, 0.) * uBHup * smoothstep(.02, .12, uBH.y);
  vec3 skyLight = (vec3(.0200, .0320, .0550) + vec3(.0065, .0490, .0230) * uAurK) * (.30 + .70 * nw.y);
  vec3 col = albedo * (uBHtint * ndl * .42 + skyLight + lampLight(pw, nw)) + (mirror ? vec3(0.) : glow);
  return vec4(airBetween(col, rd, t), 1.);
}
// a small lamp seen from far away: never less than its true light, however few pixels it covers
vec3 lampPoint(vec3 ro, vec3 rd, vec3 lp, float r, vec3 L, float tHit){
  vec3 v = lp - ro; float tca = dot(v, rd);
  if (tca < 0. || (tHit > 0. && tHit < tca - .3)) return vec3(0.);
  vec3 w = v - rd * tca;                                                   // (worked out this way so that no accuracy is lost over kilometres)
  float d2 = dot(w, w), sg = max(.6 * r, .45 * uPix * tca), s2 = 2. * sg * sg;
  return L * (r * r / s2 * exp(-d2 / s2) + .012 * r * r / (d2 + 3. * s2));   // the lamp, and the glare around it
}
// The house and all that belongs to it, along one line of sight (direct, or mirrored in the water).
// dx, dy: how the line changes from one pixel to the next; soft: take four lines for a smooth outline.
vec4 home(vec3 ro, vec3 rd, vec3 dx, vec3 dy, bool soft, out float dist){
  dist = 0.;
  vec3 c = uHomeC - ro; float tca = dot(c, rd);
  if (tca < 0. || dot(c, c) - tca * tca > 1500.) return vec4(0.);
  vec4 acc = vec4(0.); float ds = 0., tMid;
  vec4 mid = homeRay(ro, rd, !soft, tMid);
  if (soft){
    for (int i = uZero; i < 4; i++){
      vec2 o2 = vec2(float(i & 1), float(i >> 1)) * .5 - .25;
      float t; vec4 s = homeRay(ro, normalize(rd + dx * o2.x + dy * o2.y), false, t);
      acc += s; ds += s.a * t;
    }
    acc *= .25; ds *= .25;
  } else { acc = mid; ds = mid.a * tMid; }
  dist = acc.a > 0. ? ds / acc.a : tca;
  // Smoke from the chimney: a thin thread rising straight up in the still air, wavering a little, catching the light.
  vec3 cw = uHome - 2.1 * uHomeX - .7 * uHomeZ;
  vec2 hd = rd.xz, ho = cw.xz - ro.xz;
  float ts = dot(ho, hd) / max(dot(hd, hd), 1e-9), y = ro.y + rd.y * ts - cw.y - 5.05;
  if (ts > 0. && y > 0. && y < 26. && acc.a < .999){
    float x = (ho.x * hd.y - ho.y * hd.x) * inversesqrt(max(dot(hd, hd), 1e-9)), tm = uTime * .5;
    x += (vn2(vec2(y * .19 - tm, 3.7)) - .5) * .30 * y + (vn2(vec2(y * .8 - tm * 2.1, 9.1)) - .5) * .11 * min(y, 5.);
    float w = .15 + .06 * y;
    float dens = exp(-x * x / (w * w)) * (.35 + .65 * vn2(vec2(y * 1.3 - tm * 2.6, x * 2.5 + 5.))) * smoothstep(0., .5, y) * (1. - smoothstep(8., 26., y)) * (.115 / w);
    float a = clamp(dens, 0., .9) * (1. - acc.a);
    vec3 lit = vec3(.0200, .0320, .0550) + vec3(.0065, .0490, .0230) * uAurK + uBHtint * (.11 * uBHup * smoothstep(.02, .12, uBH.y)) + lampLight(ro + rd * ts, vec3(0., -1., 0.)) * .5;
    acc.rgb += lit * (.8 * a); acc.a += a;
  }
  if (soft) acc.rgb += lampPoint(ro, rd, uLampP, .07, vec3(1., .62, .26) * 55., tMid) + lampPoint(ro, rd, uLampL, .09, vec3(1., .68, .34) * 45., tMid);
  return acc;
}

// ---------- shooting stars ----------
vec3 meteor(vec3 d){
  if (uMet.w < 0.) return vec3(0.);
  vec3 a = uMet.xyz, b = uMetB;
  float ph = uMet.w, head = ph * 1.25, tail = max(head - .30, 0.);
  vec3 ab = b - a;
  float s = clamp(dot(d - a, ab) / dot(ab, ab), tail, min(head, 1.));   // nearest point of the glowing stretch
  vec3 q = normalize(a + ab * s);
  float dist = acos(clamp(dot(d, q), -1., 1.));
  float sig = max(uPix * 1.1, 2.5e-4);
  float along = (s - tail) / max(head - tail, 1e-3);
  float I = exp(-dist * dist / (sig * sig)) * along * along * sin(PI * clamp(ph, 0., 1.)) * (2.5e-4 / sig);
  return vec3(.85, .95, 1.) * I * 9.;
}

// ---------- a launch ----------
// Now and then, far behind the mountains, a point of light climbs, leans over and is gone among the stars.
uniform vec4 uRkt, uRktTail;         // where it is and how bright; where it was a moment ago and how wide its exhaust has spread
vec3 rocket(vec3 d){
  if (uRkt.w <= 0. || dot(d, uRkt.xyz) < .985) return vec3(0.);
  float sig = max(uPix * .9, 1.0e-4), i2 = 1. / (2. * sig * sig);
  vec3 a = uRkt.xyz, ab = uRktTail.xyz - a, hw = d - a;
  float len2 = max(dot(ab, ab), 1e-12), s = clamp(dot(hw, ab) / len2, 0., 1.);
  vec3 w = hw - ab * s;
  float gain = pow(3.4e-4 / sig, 1.6);
  vec3 col = (vec3(1., .88, .70) * (1.5 * exp(-dot(hw, hw) * i2)) + vec3(1., .52, .20) * (exp(-dot(w, w) * i2) * (1. - s) * (1. - s))) * (uRkt.w * gain);
  if (uRktTail.w > 0.){                                        // high up, where the air is thin, the exhaust spreads into a wide pale fan
    vec3 tdir = ab * inversesqrt(len2);
    float x = dot(hw, tdir), y2 = max(dot(hw, hw) - x * x, 0.), L = .016 * uRktTail.w, wd = .22 * max(x, 0.) + 3e-4;
    col += vec3(.62, .74, 1.) * (uRkt.w * .0018 * uRktTail.w * smoothstep(-2e-4, 6e-4, x) * exp(-max(x, 0.) / L - y2 / (2. * wd * wd)) * (4e-4 / wd));
  }
  return col;
}

// ---------- a string of lights ----------
// Sometimes a line of evenly spaced lights crosses the sky one behind the other, and fades as each enters the planet's shadow.
uniform vec3 uTrN, uTrE;             // their path lies in the plane across uTrN; uTrE points along it to where the count starts
uniform vec4 uTr;                    // how far along the first light is, the gap between lights, how many, how bright
uniform vec2 uTrF;                   // where along the path they come out of the haze, and where the shadow begins
vec3 train(vec3 d){
  if (uTr.w <= 0.) return vec3(0.);
  float sig = max(uPix * .8, 6.0e-5);
  if (abs(dot(d, uTrN)) > 4. * sig) return vec3(0.);
  vec3 e2 = cross(uTrN, uTrE);
  float phi = atan(dot(d, e2), dot(d, uTrE));
  float k = clamp(floor((uTr.x - phi) / uTr.y + .5), 0., uTr.z - 1.), th = uTr.x - k * uTr.y;
  vec3 w = d - (cos(th) * uTrE + sin(th) * e2);
  float b = uTr.w * smoothstep(uTrF.x, uTrF.x + .3, th) * (1. - smoothstep(uTrF.y - .10, uTrF.y, th));
  return vec3(.95, .97, 1.) * (b * exp(-dot(w, w) / (2. * sig * sig)) * pow(3.4e-4 / sig, 1.6));
}

// ---------- a small moon ----------
uniform vec3 uMoon, uMoonSun;        // where it stands, and from where its sun shines on it
const float MOON_R = .0034;
float moonH(vec3 p, float fine){     // the lie of its land: plains, and craters of every size (fine: how small a crater is worth drawing)
  float h = .5 * fbm3(p * 2.3 + 4., 4);
  float k = 3.3;
  for (int i = uZero; i < 5; i++){
    if (.3 / k < fine) break;
    vec3 q = p * k + float(i) * 7.31, c = floor(q);
    vec4 hs = hash4(ivec3(c) + ivec3(11 * i, 3, 5));
    float R = .16 + .16 * hs.w, r = length(fract(q) - (.34 + .32 * hs.xyz)) / R;
    if (hs.w < .75) h += (.34 / k) * (smoothstep(.55, 1., r) - 1. + 1.25 * exp(-(r - 1.) * (r - 1.) * 22.)) * smoothstep(1.7, 1., r);   // a bowl with a raised rim
    k *= 2.3;
  }
  return h;
}
vec4 moon(vec3 d){
  if (dot(d, uMoon) < 1. - MOON_R * MOON_R * .8) return vec4(0.);
  vec3 ex = normalize(cross(vec3(0., 1., 0.), uMoon)), ey = cross(uMoon, ex);
  vec2 xy = vec2(dot(d, ex), dot(d, ey)) / MOON_R;
  float r = length(xy), aa = uPix / MOON_R, cov = smoothstep(1. + aa, 1. - aa, r);
  if (cov <= 0.) return vec4(0.);
  float z = sqrt(max(1. - r * r, 0.));
  vec3 sp = vec3(xy, z), n = xy.x * ex + xy.y * ey - z * uMoon;
  float fine = 1.5 * aa, e = max(aa, .002);
  float h = moonH(sp, fine);
  vec2 g = vec2(moonH(sp + vec3(e, 0., 0.), fine), moonH(sp + vec3(0., e, 0.), fine)) - h;
  vec3 n0 = n;
  n = normalize(n - (g.x * ex + g.y * ey) * (1.1 / e) * z);                // (the relief flattens out toward the rim, where it is seen edge-on)
  float sea = smoothstep(.52, .40, fbm3(sp * 1.4 + 9., 4));                // the dark plains
  float albedo = mix(.135, .062, sea) * (.85 + .5 * fbm3(sp * 9., 3)) + .05 * smoothstep(.05, .12, h - .25 * fbm3(sp * 2.3 + 4., 4));
  float lam = max(dot(n, uMoonSun), 0.) * smoothstep(-.04, .10, dot(n0, uMoonSun));   // only near the edge of night do crater rims still catch the sun
  vec3 col = albedo * (vec3(1., .96, .90) * (lam * 22.) + vec3(.32, .46, .72) * .016);   // its sun on one side; on the other, the faint light of the planet below
  return vec4(col * cov, cov);
}

// ---------- the dish on the ridge ----------
// On one crest stands a dish, turned toward a single modest star. A red lamp on top of it blinks.
uniform vec3 uDishTo;                // the direction it listens in
const float DISH_U = .0987;          // where along the skyline it stands (share of the full circle)
// col: what lies behind it; returns that with the dish in front. u, te: the direction looked in
vec3 dish(vec3 col, vec3 d, float u, float te){
  if (abs(u - DISH_U) > .0011) return col;
  vec2 hz = textureLod(uHorizon, vec2(DISH_U, .5), 0.).rg;
  float D = hz.g * sqrt(1. + hz.r * hz.r), az = DISH_U * TAU, ce = inversesqrt(1. + hz.r * hz.r);
  vec3 dP = vec3(sin(az) * ce, hz.r * ce, cos(az) * ce);                    // the foot of its tower, on the crest
  vec3 ex = normalize(cross(vec3(0., 1., 0.), dP)), ey = cross(dP, ex);
  vec3 w = (d / dot(d, dP) - dP) * D;
  vec2 q = vec2(dot(w, ex), dot(w, ey));                                     // metres, right and up from the foot of the tower
  if (abs(q.x) > 26. || q.y < -8. || q.y > 46.) return col;
  float pm = uPix * D * .7;                                                  // half a pixel, in metres
  vec2 a2 = vec2(dot(uDishTo, ex), dot(uDishTo, ey));
  float toward = -dot(uDishTo, dP), side = max(length(a2), 1e-3);
  vec2 ah = a2 / side, mh = vec2(-ah.y, ah.x);
  vec2 piv = vec2(0., 19.), c = piv + a2 * 2.5, pc = q - c;
  float xa = dot(pc, ah), xm = dot(pc, mh);
  const float R = 11.5, DEEP = 4.;
  // the rim of the dish, seen at a slant: an ellipse; and the bowl behind the rim
  vec2 e2 = vec2(xm / R, xa / (R * abs(toward) + .25));
  float rr = length(e2), rimIn = 1. - rr;
  float cDish = smoothstep(-pm / R, pm / R, rimIn);
  float tb = clamp(-xa / (DEEP * side), 0., 1.);
  cDish = max(cDish, smoothstep(-pm, pm, R * sqrt(1. - tb) - abs(xm)) * step(xa, 0.) * step(-xa, DEEP * side));
  // the arm that holds the receiver in front of it, the tower beneath, the hut at its foot
  vec2 f = c + a2 * 9.5; float lf = clamp(dot(q - c, f - c) / dot(f - c, f - c), 0., 1.);
  float cArm = max(smoothstep(pm, -pm, length(q - c - (f - c) * lf) - .22), smoothstep(pm, -pm, length(q - f) - .8));
  float cTower = smoothstep(pm, -pm, abs(q.x) - mix(3.2, 1.1, clamp(q.y / 19., 0., 1.))) * step(q.y, 19.) * step(-8., q.y);
  float cHut = smoothstep(pm, -pm, abs(q.x - 9.) - 3.5) * smoothstep(pm, -pm, q.y - 4.) * step(-8., q.y);
  // painted white, it shows pale against the night: lit by the sky and the aurora, and by the black hole from one side
  vec3 amb = vec3(.0200, .0320, .0550) + vec3(.0065, .0490, .0230) * uAurK;
  vec3 sun = uBHtint * (.42 * uBHup * smoothstep(.02, .12, uBH.y));
  vec2 rad2 = (mh * xm + ah * xa) / max(length(vec2(xm, xa)), 1e-3);
  vec3 nd = normalize(-uDishTo * sign(-toward + 1e-4) + (ex * rad2.x + ey * rad2.y) * (1.1 * min(rr, 1.)));     // the back of the bowl bulges toward us
  float ang = atan(e2.y, e2.x);
  float ribs = .80 + .20 * smoothstep(.06, .30, abs(fract(ang * (12. / TAU)) - .5) * 2.) * smoothstep(.03, .10, abs(fract(rr * 2.5 + .5) - .5) * 2.);
  vec3 cd = vec3(.60, .62, .64) * (amb * (.45 + .55 * max(nd.y * .5 + .5, 0.)) + sun * max(dot(nd, uBH), 0.)) * ribs * step(0., rimIn)
          + vec3(.42, .43, .45) * (amb * .55 + sun * max(dot(nd, uBH), 0.) * .6) * (1. - step(0., rimIn));
  vec3 ct = vec3(.44, .45, .46) * (amb * .6 + sun * (.25 + .5 * smoothstep(1.5, -1.5, q.x / max(mix(3.2, 1.1, clamp(q.y / 19., 0., 1.)), .1) * dot(ex, uBH) * -3.)));
  vec3 ch = q.y > 3.45 ? vec3(.80, .84, .90) * amb : vec3(.07, .055, .045) * (amb + sun * .3);
  vec3 body = mix(mix(mix(ch, ct, cTower), vec3(.30, .31, .32) * (amb * .6 + sun * .3), cArm), cd, cDish);
  col = mix(col, airBetween(body, d, D), max(max(cDish, cArm), max(cTower, cHut)));
  // lamps: a window in the hut, and the red one on top, blinking
  float sg = max(pm, .35), i2 = 1. / (2. * sg * sg);
  vec2 top = c + mh * (R + 1.) * sign(mh.y + 1e-4);
  float blink = smoothstep(0., .04, fract(uTime / 1.7)) * (1. - smoothstep(.16, .22, fract(uTime / 1.7)));
  col += vec3(1., .07, .03) * (blink * 14. * (.12 / (sg * sg)) * exp(-dot(q - top, q - top) * i2));
  col += vec3(1., .66, .34) * (2.2 * (.10 / (sg * sg)) * exp(-dot(q - vec2(9., 1.6), q - vec2(9., 1.6)) * i2));
  return col;
}

// ---------- sky ----------
// everything above the water along direction d: stars, the black hole, the air, the mountains
vec3 sky(vec3 d, out float dist){
  float cov; vec3 mt = mountains(d, cov, dist);              // (asked first: the far shore lies a hair below the level of the eye)
  d.y = max(d.y, .0004); d = normalize(d);
  vec3 dir; float vis;
  vec3 col = lens(d, cov > .999, dir, vis) * uBHlum;
  if (cov < .999){
    if (vis > .003 && !(uDbg > 1.5 && uDbg < 2.5)){
      vec3 dc = uCel * dir;
      // How much sky does one pixel cover? The hole stretches and squeezes the sky around it. This is measured on the
      // smooth bending far from the hole, and on the traced light itself only close to it.
      float cb = dot(d, uBH), bb = uBHd * sqrt(max(1. - cb * cb, 0.));
      vec3 dfar = normalize(d + normalize(uBH - d * cb + 1e-6) * tan(min((1. + cb) / max(bb, .001), 1.)));
      vec3 jx = dFdx(dc), jy = dFdy(dc);
      float fpS = max(length(dFdx(dfar)), length(dFdy(dfar))), fpT = max(length(jx), length(jy));
      float fp = clamp(mix(fpT, fpS, smoothstep(4., 7., bb)), uPix * .2, .05);
      float mu = length(cross(dFdx(d), dFdy(d))) / max(length(cross(jx, jy)), 1e-30);       // how much the hole magnifies this part of the sky
      col += vis * (stars(dc, d.y, jx, jy, mu) + milkyway(dc, fp));
    }
    col += meteor(d) + rocket(d) + train(d);
    vec4 mn = moon(d);
    col = col * (1. - mn.a) + mn.rgb;
    col *= airTrans(d.y);
    col += air(d);
    col += aurora(d) * airTrans(d.y);
  }
  if (cov < .001) dist = 1e6;
  if (cov < .999) col = dish(col, d, atan(d.x, d.z) / TAU, d.y / length(d.xz));
  return mix(col, mt, cov);
}

// ---------- water ----------
uniform sampler2D uSim;              // the simulated patch of water around us: height in red
uniform float uSimOn, uSimTexel;
const float SIMW = 24.;              // the patch is this many metres across
// the faint ripples that are always there, livelier in drifting patches and glassy between them
vec2 ripple(vec2 p, float e){                                 // slope of a field of soft bumps
  float c = vn2(p);
  return vec2(vn2(p + vec2(e, 0.)) - c, vn2(p + vec2(0., e)) - c) / e;
}
vec2 ambient(vec2 q, float foot){
  float gust = smoothstep(.30, .80, vn2(q * .07 + vec2(uTime * .013, -uTime * .009)));
  vec2 s = vec2(0.);
  float L = 2.2, a = 1.;
  for (int i = 0; i < 4; i++){
    float fi = float(i), sp = .16 * sqrt(L);                  // smaller ripples creep more slowly
    float vis = clamp(L / (2.2 * foot) - .4, 0., 1.);
    if (vis > 0.){
      vec2 p = q / L;
      vec2 g = ripple(p + vec2(uTime * sp, fi * 17.) / L, .22) + ripple(p * 1.31 + vec2(fi * 9. - uTime * sp * .7, uTime * sp * .9) / L, .22);
      s += g * (a * vis * (i < 2 ? 1. : .25 + 1.4 * gust));
    }
    L *= .42; a *= .62;
  }
  return s * .0036;
}
vec2 stirred(vec2 q, float foot){

// The new height follows from how real water waves travel: long waves fast, short waves slow.
in vec2 vUv; out vec4 o;
uniform sampler2D uSim;
uniform float uC;                    // (time step)^2 x gravity / grid spacing
uniform vec4 uFinger;                // a finger moved from xy to zw during this step (in grid cells)
uniform vec2 uFingerK;               // how firmly it holds the water (0: no finger), and how deep it presses (m)
uniform vec4 uDrop[4];               // things falling in: xy where (grid cells), z size (cells), w depth (m)
const float KG[25] = float[25](1.9232736, -0.1658402, -0.0668236, 0.0271379, -0.0238873, -0.1658402, -0.1642196, -0.0226023, 0.0202527, -0.0221183, -0.0668236, -0.0226023, 0.0364334, -0.0165923, -0.0111362, 0.0271379, 0.0202527, -0.0165923, -0.0166662, -0.0011553, -0.0238873, -0.0221183, -0.0111362, -0.0011553, -0.0002489);
const float KD[25] = float[25](0.71848519, 0.12500741, -0.03083704, 0.00500741, -0.00042037, 0.12500741, -0.02677037, -0.00414815, 0.0022963, -0.00028148, -0.03083704, -0.00414815, 0.00274074, 0.00011852, -9.259e-05, 0.00500741, 0.0022963, 0.00011852, -0.0001037, -1.481e-05, -0.00042037, -0.00028148, -9.259e-05, -1.481e-05, -9.3e-07);
void main(){

    vec2 v = texelFetch(uSim, clamp(c + ivec2(i, j), ivec2(0), sz - 1), 0).rg;
    int k = abs(j) * 5 + abs(i);
    sG += KG[k] * v.r; sD += KD[k] * (v.r - v.g);
  }

}

const float EL0 = -.007, EL1 = .313;                 // the mountain panorama covers these elevations (radians)
const float EYE = 1.6;

uniform float uLightAz;
uniform sampler2D uHmap, uHaux;

// What is finer than the map: folds upon folds, and gullies running down the steep faces. Returns the height to add.
// oct: how fine to go (5: nothing; each step 2.2 times finer; may be a fraction, so detail fades in without a jump).
// gully: how deep in a gully the spot lies (0..1).
float fineH(vec2 p, vec3 b, float oct, out float gully){

    // further in they are tucked under the tier above, and it is dark between them.
    float e = max(1.5 * F, .03);

}

void main(){

  float dh = length(d.xz);

  float S = shore(az);

  // above the skyline, with room left for the trees on it, there is only sky
  float u = az / TAU, du = 1. / float(textureSize(uHorizon, 0).x);
  vec2 h0 = textureLod(uHorizon, vec2(u - du, .5), 0.).rg, h1 = textureLod(uHorizon, vec2(u, .5), 0.).rg, h2 = textureLod(uHorizon, vec2(u + du, .5), 0.).rg;

  float sTreeMax = te > 1e-5 ? (700. - uCamH) / te : 1e9;                 // no tree grows higher up than this; beyond, the line of sight is above them all

  // ---- the ground: walk along the line of sight, in steps as long as the height above the ground allows ----
  float s = S * .995, sp = s, cp = 1e9, pxPrev = 1e9, bestPx = 1e9, sBest = s, sTree = -1., sLast = s, rug = 0., oct = 6., gu;
  vec3 b; bool ex, hit = false;
  for (int i = uZero; i < 200; i++){
    vec2 p = dir * s; float y = uCamH + te * s, F = uPix * s;
    rug = rugAt(s); oct = octFor(F);
    float c = gap(p, y - 25. * rug, oct, b, ex, gu);
    if (ex) c += rug * (25. - b.y * (13. + 12. * vn2(p / 7. + 3.)));
    if (c < TREE_TOP + 3. && s < sTreeMax && rug < 1.){ if (sTree < 0.) sTree = sp; sLast = s; }   // from here on a tree could stand in the way
    // where the line of sight skims past a crest without touching it, note by how many pixels it clears it
    float px = ex ? c / F : 1e9;

    // step is judged from how fast the gap has been closing, not just from the gap.

  // ---- the trees: go through the squares of forest floor under the line of sight, nearest first ----

  vec2 qT, cT, qN, cN, rhT, rhN; vec4 hT, hN;
  if (sTree >= 0. && uPixF * sTree < 2.4){
    float sB = min(hit ? s : sLast + 40., sTreeMax);
    vec2 pA = dir * sTree, cell = floor(pA / CELL);

                }

              }
            }
          }
        }

          float rr = re > 0. && (rho - re) / (uPix * sc) < bestT ? treeR(t, Rt, q * inversesqrt(max(dot(q, q), 1e-6)), hs) : 0.;

            }

      if (sT >= 0.) break;

canvas.addEventListener("pointerup", release); canvas.addEventListener("pointercancel", release);

canvas.addEventListener("wheel", ev => {

canvas.addEventListener("contextmenu", ev => ev.preventDefault());
const keys = new Set();
addEventListener("keydown", ev => {

addEventListener("keyup", ev => keys.delete(ev.key));
addEventListener("blur", () => keys.clear());

function moveView(dt) {

// ---------- running ----------
const dbgInfo = gl.getExtension("WEBGL_debug_renderer_info"), gpuName = dbgInfo ? String(gl.getParameter(dbgInfo.UNMASKED_RENDERER_WEBGL)).slice(0, 110) : "";

const tourOn = Q.has("hud") || Q.has("tour");
const hud = Q.has("hud") ? document.body.appendChild(Object.assign(document.createElement("pre"), {id: "hud"})) : null;
let last = 0, stage = 0, ema = 16.7, slowFor = 0, fastFor = 0, ceiling = 9, ceilingAt = 0, retry = 45, nextRing = 22, shown = 0, stalls = 0, scale0 = 0, light = false;
function lighten() {                                               // a slow graphics card: fewer steps through the aurora, a coarser water grid
  if (light) return;
  light = true; SZ.aur = Math.min(SZ.aur, 32);

}
function adapt(dtMs, now) {                                        // keeps the motion smooth by trading sharpness for speed
